name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Core engine: builds and unit-tests the RunOfShowKit Swift package on Linux.
  # No network, no API key required.
  # ---------------------------------------------------------------------------
  linux-core-tests:
    name: Linux • swift build & test
    runs-on: ubuntu-latest
    container:
      image: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build core package
        run: swift build

      - name: Run unit tests
        run: swift test

  # ---------------------------------------------------------------------------
  # iOS Simulator: generates the Xcode project, builds the SwiftUI app for the
  # simulator, runs the XCUITest in deterministic offline mock mode, and exports
  # the captured input + results screenshots as artifacts.
  # ---------------------------------------------------------------------------
  ios-simulator-uitests:
    name: macOS • iOS Simulator UI tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          # Choose a currently-installed iPhone simulator on the runner.
          DEVICE=$(xcrun simctl list devices available | grep -Eo 'iPhone 16( Pro)?' | head -1)
          if [ -z "$DEVICE" ]; then
            DEVICE=$(xcrun simctl list devices available | grep -Eo 'iPhone 15( Pro)?' | head -1)
          fi
          if [ -z "$DEVICE" ]; then
            DEVICE="iPhone 16"
          fi
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build & run UI tests (mock mode)
        run: |
          set -o pipefail
          xcodebuild test \
            -project RunOfShow.xcodeproj \
            -scheme RunOfShow \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | xcpretty || true
          # Fail the job if the result bundle was not produced.
          test -d TestResults.xcresult

      - name: Extract screenshots from result bundle
        if: always()
        run: |
          brew install chargepoint/xcparse/xcparse || brew install xcparse
          mkdir -p docs/screenshots
          xcparse screenshots --os --device --test TestResults.xcresult docs/screenshots || true
          # Normalize to stable filenames the README expects.
          python3 - <<'PY'
          import os, glob, shutil
          root = "docs/screenshots"
          mapping = {"01-input-screen": "input-screen.png", "02-results-screen": "results-screen.png"}
          for path in glob.glob(os.path.join(root, "**", "*.png"), recursive=True):
              base = os.path.basename(path)
              for key, dest in mapping.items():
                  if key in base:
                      shutil.copy(path, os.path.join(root, dest))
          print(os.listdir(root))
          PY
          ls -R docs/screenshots || true

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: docs/screenshots/**/*.png
          if-no-files-found: warn

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-bundle
          path: TestResults.xcresult
          if-no-files-found: warn
