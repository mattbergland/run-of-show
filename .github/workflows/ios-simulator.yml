name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Core engine: builds and unit-tests the RunOfShowKit Swift package on Linux.
  # No network, no API key required.
  # ---------------------------------------------------------------------------
  linux-core-tests:
    name: Linux • swift build & test
    runs-on: ubuntu-latest
    container:
      image: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build core package
        run: swift build

      - name: Run unit tests
        run: swift test

  # ---------------------------------------------------------------------------
  # iOS Simulator: generates the Xcode project, builds the SwiftUI app for the
  # simulator, runs the XCUITest in deterministic offline mock mode, and exports
  # the captured input + results screenshots as artifacts.
  # ---------------------------------------------------------------------------
  ios-simulator-uitests:
    name: macOS • iOS Simulator UI tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a booted-capable simulator
        id: sim
        run: |
          # Select an *available* iPhone simulator UDID (guaranteed to have an
          # installed runtime), preferring newer models. Using the UDID avoids
          # the "OS:latest" resolver picking a runtime that isn't installed.
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              for dev in devices:
                  if not dev.get("isAvailable"):
                      continue
                  name = dev["name"]
                  if not name.startswith("iPhone"):
                      continue
                  # Prefer higher iOS runtime, then "Pro"/higher model numbers.
                  score = (runtime, "Pro" in name, name)
                  if best is None or score > best[0]:
                      best = (score, dev["udid"], name, runtime)
          if best is None:
              sys.exit("No available iPhone simulator found")
          print(best[1])
          sys.stderr.write(f"Using {best[2]} on {best[3]} ({best[1]})\n")
          ')
          echo "Picked simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & run UI tests (mock mode)
        run: |
          set -o pipefail
          xcodebuild test \
            -project RunOfShow.xcodeproj \
            -scheme RunOfShow \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee xcodebuild.log

      - name: Extract screenshots from result bundle
        if: always()
        run: |
          brew install chargepoint/xcparse/xcparse || brew install xcparse
          mkdir -p docs/screenshots
          xcparse screenshots --os --device --test TestResults.xcresult docs/screenshots || true
          # Normalize to the stable filenames the README expects.
          python3 - <<'PY'
          import os, glob, shutil
          root = "docs/screenshots"
          mapping = {"01-input-screen": "input-screen.png", "02-results-screen": "results-screen.png"}
          pngs = sorted(
              p for p in glob.glob(os.path.join(root, "**", "*.png"), recursive=True)
              if os.path.basename(p) not in mapping.values()
          )
          matched = set()
          for path in pngs:
              base = os.path.basename(path)
              for key, dest in mapping.items():
                  if key in base:
                      shutil.copy(path, os.path.join(root, dest))
                      matched.add(dest)
          # Fallback: if attachment names didn't match, assign by sorted order.
          remaining = [d for d in ("input-screen.png", "results-screen.png") if d not in matched]
          for dest, path in zip(remaining, pngs):
              shutil.copy(path, os.path.join(root, dest))
          print("docs/screenshots:", sorted(os.listdir(root)))
          PY
          ls -R docs/screenshots || true

      - name: Verify screenshots were captured
        run: |
          test -f docs/screenshots/input-screen.png
          test -f docs/screenshots/results-screen.png
          echo "Both screenshots present."

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: warn

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-bundle
          path: TestResults.xcresult
          if-no-files-found: warn
